# Publishes a v<version> tag to npm with trusted publishing (OIDC) and provenance, after a
# reviewer approves the release environment. The guard refuses a private package or a tag that
# differs from the version, and release:check refuses a version without a CHANGELOG section.
# A rerun skips a version that is already on npm.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard (not private, the tag equals the version)
        run: |
          # The ${...} below is JavaScript inside a single-quoted node -e script.
          # shellcheck disable=SC2016
          node -e '
            const manifest = require("./package.json")
            const tag = process.env.GITHUB_REF_NAME
            if (manifest.private === true) { console.error("package.json is private"); process.exit(1) }
            if (tag !== `v${manifest.version}`) { console.error(`tag ${tag} does not match version ${manifest.version}`); process.exit(1) }
          '
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in release builds
      # Trusted publishing needs npm 11.5.1 or later; the npm bundled with Node 24 has it.
      - name: Check npm supports trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("npm " + process.argv[1] + " is older than 11.5.1, which trusted publishing needs")
              process.exit(1)
            }
          ' "$(npm --version)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run release:check
      # npm run check has built dist/; the package has no prepack script.
      - name: Pack
        run: |
          npm pack --ignore-scripts
          tarballs=(./*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "Expected exactly one package tarball" >&2
            exit 1
          fi
      - name: Check the tarball that will be published
        run: node scripts/pack-smoke.mjs --tarball ./*.tgz
      - name: Publish to npm
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          # npm view fails with E404 while the version is not published yet.
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; skipping the publish."
            exit 0
          fi
          npm publish ./*.tgz --provenance --access public
