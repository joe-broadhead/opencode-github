name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x64, Linux arm64, macOS arm64 and macOS x64, pinned to image versions.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    # The host, pack and stock stages install each tested OpenCode release (TESTED_HOSTS in src/host-version.ts:
    # 2.2.3, 2.2.4, 2.2.5 and 2.2.6) themselves, with scripts disabled.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # OpenCode installs plugins without lifecycle scripts, and no dev dependency needs them.
      - run: npm ci --ignore-scripts
      - run: npm run check
